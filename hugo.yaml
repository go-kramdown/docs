# go-kramdown documentation: Hugo + Hextra, built like go-llmflow/docs.
#
# Each documentation version is a separate build under
# https://go-kramdown.github.io/docs/<version>/, where <version> is the minor
# version of the code the pages describe, or "main" while no release is tagged.
# The CI sets it through --baseURL, from params.docs.version below; this
# default is the same build.
baseURL: "https://go-kramdown.github.io/docs/main/"
title: "go-kramdown docs"

# themes/hextra is the tannevaled/hextra fork, pinned at a release tag as a
# submodule: upstream Hextra plus opt-in features.
theme: hextra

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    label: "English"
    contentDir: content/en
    weight: 1

enableRobotsTXT: true
# Git history dates every page: "Last updated on" at the foot of each one.
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        title: true
        block: true
  highlight:
    noClasses: false

# The content is NOT under content/en/docs. This site is served AT /docs/, so a
# "docs" section would make every page /docs/docs/... . Hextra picks its
# documentation layout from the section being called "docs", so with the
# content at the root the type is cascaded instead.
cascade:
  - target:
      path: "/**"
    params:
      type: docs

module:
  mounts:
    - source: static
      target: static
    - source: assets
      target: assets

# Navbar, left to right: version, theme, search, sources. The version selector
# is the fork's own component: it reads versions.json, which pagespublish writes.
menu:
  main:
    - name: Version
      weight: 3
      params:
        type: partial
        partial: components/version-select.html
    - name: Theme
      weight: 4
      params:
        type: theme-toggle
        combo: true
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      url: https://github.com/go-kramdown
      weight: 6
      params:
        icon: github

params:
  docs:
    # The kramdown release these pages describe (v0.3.1 -> documentation
    # version 0.3, published at /docs/0.3/). The CI reads it here.
    version: "v0.3.1"
  versions:
    # What the version selector shows for the "main" build (development icon).
    development: "main"
  description: "go-kramdown: a pure-Go kramdown Markdown-to-HTML converter."
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/brand/logo.svg
      dark: images/brand/logo.svg
      width: 32
      height: 32
      # Related sites, opened from the chevron beside the title.
      menu:
        - name: go-kramdown
          url: https://go-kramdown.github.io/
          logo: images/brand/logo.svg
  theme:
    default: system
    displayToggle: false
    darkreaderLock: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  toc:
    displayTags: true
  page:
    width: normal
    displayDescription: true
    # "Created on ... by ... / Modified on ... by ..." at the foot of each page:
    # creation from data/pagehistory.json (the CI writes it with the theme's
    # cmd/pagehistory); modification from git (enableGitInfo).
    history: true
  editURL:
    enable: true
    base: "https://github.com/go-kramdown/docs/edit/main/content/en"
